    tight compute and token budgets. Existing test time reasoning methods such as self consistency
    (sampling multiple rationales and voting), Tree-of-Thoughts (search over intermediate thoughts),
    and critique revise loops improve performance, but often at high token cost and without
    fine-grained step-level control. This project1 aims to address that gap: can Small Language
    Models (SLMs) reason reliably using the same or fewer tokens? This question is…
